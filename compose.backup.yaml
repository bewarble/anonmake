services:
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup_postgres.sh:/usr/local/bin/backup_postgres.sh:ro
      - postgres_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /usr/local/bin/backup_postgres.sh
          sleep ${BACKUP_INTERVAL_SECONDS:-86400}
        done
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anonmake

volumes:
  postgres_backups:
