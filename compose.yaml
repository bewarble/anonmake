name: anonmake

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anonmake}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-anonmake}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks:
    - anonmake
  stop_grace_period: 30s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anonmake}
      POSTGRES_USER: ${POSTGRES_USER:-anonmake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anonmake
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-anonmake} -d ${POSTGRES_DB:-anonmake}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - anonmake
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anonmake}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-anonmake}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "scripts.migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anonmake

  bot:
    <<: *app-common
    command: ["python", "-m", "app.main"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bot-two:
    <<: *app-common
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anonmake}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-anonmake}
      REDIS_URL: redis://redis:6379/0
      BOT_CODE: ${BOT_TWO_CODE:-secondary}
      BOT_TOKEN: ${BOT_TWO_TOKEN:?Set BOT_TWO_TOKEN in .env}
      BOT_USERNAME: ${BOT_TWO_USERNAME:?Set BOT_TWO_USERNAME in .env}
      BOT_DISPLAY_NAME: ${BOT_TWO_DISPLAY_NAME:-Second Bot}
    command: ["python", "-m", "app.main"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bot-three:
    <<: *app-common
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anonmake}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-anonmake}
      REDIS_URL: redis://redis:6379/0
      BOT_CODE: ${BOT_THREE_CODE:-third}
      BOT_TOKEN: ${BOT_THREE_TOKEN:?Set BOT_THREE_TOKEN in .env}
      BOT_USERNAME: ${BOT_THREE_USERNAME:?Set BOT_THREE_USERNAME in .env}
      BOT_DISPLAY_NAME: ${BOT_THREE_DISPLAY_NAME:-Third Bot}
    command: ["python", "-m", "app.main"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bot-four:
    <<: *app-common
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anonmake}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-anonmake}
      REDIS_URL: redis://redis:6379/0
      BOT_CODE: ${BOT_FOUR_CODE:-fourth}
      BOT_TOKEN: ${BOT_FOUR_TOKEN:?Set BOT_FOUR_TOKEN in .env}
      BOT_USERNAME: ${BOT_FOUR_USERNAME:?Set BOT_FOUR_USERNAME in .env}
      BOT_DISPLAY_NAME: ${BOT_FOUR_DISPLAY_NAME:-Fourth Bot}
    command: ["python", "-m", "app.main"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  managed-bots:
    <<: *app-common
    command: ["python", "-m", "app.managed_bots"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    <<: *app-common
    volumes:
      - ./var:/app/var:ro
      - ./backups/deploy:/app/backups/deploy:ro
    command:
      [
        "uvicorn",
        "app.web.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips=*"
      ]
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    <<: *app-common
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:

networks:
  anonmake:
    driver: bridge
