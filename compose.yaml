name: anonmake

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anonmake}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-anonmake}
    REDIS_URL: redis://redis:6379/0
    WORKER_HEARTBEAT_DIR: /tmp/anonmake-health
  volumes:
    - runtime_health:/tmp/anonmake-health
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks:
    - anonmake
  stop_grace_period: 30s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anonmake}
      POSTGRES_USER: ${POSTGRES_USER:-anonmake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anonmake
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-anonmake} -d ${POSTGRES_DB:-anonmake}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - anonmake
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anonmake}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-anonmake}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "scripts.migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anonmake

  runtime-health-init:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chown anonmake:anonmake /tmp/anonmake-health
        chmod 0775 /tmp/anonmake-health
    volumes:
      - runtime_health:/tmp/anonmake-health
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - anonmake

  # Stage 64 unified Telegram runtime. All active BotInstance rows are polled
  # inside this one service; no per-project Docker service is required.
  managed-bots:
    <<: *app-common
    depends_on:
      migrate:
        condition: service_completed_successfully
      runtime-health-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.managed_bots"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.worker_healthcheck", "managed-bots", "--max-age", "75"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  web:
    <<: *app-common
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anonmake}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-anonmake}
      REDIS_URL: redis://redis:6379/0
      WORKER_HEARTBEAT_DIR: /tmp/anonmake-health
    volumes:
      - runtime_health:/tmp/anonmake-health:ro
      - ./var:/app/var:ro
      - ./backups/deploy:/app/backups/deploy:ro
    command:
      [
        "uvicorn",
        "app.web.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips=*"
      ]
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    <<: *app-common
    depends_on:
      migrate:
        condition: service_completed_successfully
      runtime-health-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.worker_healthcheck", "billing-worker", "--max-age", "180"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  postgres_data:
  redis_data:
  runtime_health:

networks:
  anonmake:
    driver: bridge
