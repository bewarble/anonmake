{% if pages > 1 %}
<nav class="pagination" aria-label="Навигация по страницам" data-pagination>
  {% if page > 0 %}<a rel="prev" data-page="{{ page - 1 }}" href="?page={{ page - 1 }}">← Назад</a>{% else %}<span class="pagination-disabled">← Назад</span>{% endif %}
  <span>Страница <strong>{{ page + 1 }}</strong> из {{ pages }}</span>
  {% if page + 1 < pages %}<a rel="next" data-page="{{ page + 1 }}" href="?page={{ page + 1 }}">Вперёд →</a>{% else %}<span class="pagination-disabled">Вперёд →</span>{% endif %}
</nav>
{% endif %}
