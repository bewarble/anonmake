{% if pages > 1 %}
<nav class="pagination">
  {% if page > 0 %}<a href="?page={{ page - 1 }}{% if q %}&q={{ q|urlencode }}{% endif %}">← Назад</a>{% endif %}
  <span>Страница {{ page + 1 }} из {{ pages }}</span>
  {% if page + 1 < pages %}<a href="?page={{ page + 1 }}{% if q %}&q={{ q|urlencode }}{% endif %}">Вперёд →</a>{% endif %}
</nav>
{% endif %}
